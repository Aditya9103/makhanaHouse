name: Deploy Makhana Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd /opt/apps/makhana

            git pull origin main

            cd server

            docker build -t makhana-api:latest .

            docker stop makhana-api || true
            docker rm makhana-api || true

            docker run -d \
              --name makhana-api \
              --restart unless-stopped \
              --env-file /opt/apps/makhana/env/production.env \
              -p 127.0.0.1:3002:3001 \
              makhana-api:latest

            docker image prune -f
